name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 21 pre-existing react-hooks/set-state-in-effect errors remain as of
      # this workflow's introduction (unrelated to any change that added
      # this CI) - each needs its own effect restructured, not a blind
      # fix. Reporting only, not blocking, until that's cleaned up -
      # flip continue-on-error to false once `npm run lint` is clean.
      - run: npm run lint
        continue-on-error: true

      - run: npm test

      - run: npm run build
